<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คู่มือพนักงาน - HR Handbook</title>
  <meta name="description" content="กฎเกณฑ์ ระเบียบ และสวัสดิการของบริษัท สำหรับพนักงาน">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e66'/%3E%3Cpath d='M9 22V10h3v4.5h8V10h3v12h-3v-4.8h-8V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8h7M9 12h5"/></svg>
        </span>
        <span class="brand-name">HR Handbook<span class="brand-sub">คู่มือพนักงาน</span></span>
      </a>
      <a class="nav-link" href="/admin">สำหรับผู้ดูแล</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <span class="eyebrow">Company Policy</span>
        <h1>กฎเกณฑ์และสวัสดิการของบริษัท</h1>
        <p>รวมระเบียบและข้อปฏิบัติสำหรับพนักงานไว้ในที่เดียว ค้นหาหัวข้อที่ต้องการ หรือสอบถามผู้ช่วย HR ผ่าน LINE ได้ตลอดเวลา</p>
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="ค้นหา เช่น การลา, เวลาทำงาน, สวัสดิการ" autocomplete="off" aria-label="ค้นหากฎเกณฑ์">
        </label>
      </div>
    </section>

    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="กรองตามหมวดหมู่"></div>
      <p class="meta" id="meta"></p>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <div class="wrap" id="footer">HR Handbook</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
